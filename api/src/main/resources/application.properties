spring.application.name=mypokedex

# Base de datos MySQL (MariaDB/XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/mypokedexv1
spring.datasource.username=root
spring.datasource.password=TuPasswordAqui
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
server.error.include-message=always

# Clave secreta para firmar los tokens (mínimo 32 caracteres).
# En un proyecto real NUNCA se escribe aquí: se lee de una variable de entorno.
jwt.secreto=clave-secreta-de-ejemplo-para-clase-cambiala-1234567890
# Duración del token en milisegundos (3600000 = 1 hora)
jwt.duracion=3600000
